[project]
name = "cap-python"
version = "0.1.0"
description = "Capacitacion Python"
authors = [
    {name = "Manuel Guillen Jimenez"}
]
license = "3.12.10"
requires-python = ">=3.12.10"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "tzdata (>=2026.3,<2027.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "tenacity (==9.1.2)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "bcrypt (==4.0.1)",
]

packages = [
    { include = "laboratorio", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

# =========================
# BLACK
# =========================

[tool.black]
line-length = 88
target-version = [
    "py312"
]

# =========================
# ISORT
# =========================

[tool.isort]
profile = "black"
line_length = 88

# =========================
# RUFF
# =========================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W"
]

ignore = []