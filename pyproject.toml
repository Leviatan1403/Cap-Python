[project]
name = "cap-python"
version = "0.1.0"
description = "Capacitacion Python"
authors = [
    {name = "Manuel Guillen Jimenez"}
]
license = "3.12.10"
requires-python = ">=3.12.10"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)"
]

packages = [
    { include = "laboratorio", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]

# =========================
# BLACK
# =========================

[tool.black]
line-length = 88
target-version = [
    "py312"
]

# =========================
# ISORT
# =========================

[tool.isort]
profile = "black"
line_length = 88

# =========================
# RUFF
# =========================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W"
]

ignore = []